[project]
name = "closeread"
version = "0.1.0"
description = "Grounded, evidence-linked fact extraction from scientific publications"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "httpx>=0.27",
    "boto3>=1.34",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "google-genai>=1.0",
    "duckdb>=1.0",
    "matplotlib>=3.8",
]

[project.scripts]
closeread = "closeread.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["closeread"]

[tool.pytest.ini_options]
testpaths = ["tests"]
